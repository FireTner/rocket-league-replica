; free-play settings. Written by Settings::Save.

[version]
schema = 1

[camera]
; fov is the horizontal field of view. snap returns a released swivel.
; shake and air_heading are off. See README.
fov = 110
distance = 270
height = 100
angle = -3
stiffness = 0.45
ballcam = true
transition_speed = 1.5
swivel_speed = 5.0
shake = false
invert_swivel = false
snap = true
air_heading = false

[input]
throttle = W,Up/S,Down
steer = A,Left/D,Right
pitch = W,Up/S,Down
yaw = A,Left/D,Right
roll = Q/E
jump = L
boost = K
handbrake = LeftShift,RightShift
ballcam_toggle = Space
reset_car = R
reset_ball = C
unlimited = U
menu = Escape
kickoff_0 = 1
kickoff_1 = 2
kickoff_2 = 3
kickoff_3 = 4
kickoff_4 = 5
deadzone = 0.08
pad_jump = A
pad_boost = B
pad_handbrake = X
pad_ballcam_toggle = Y
pad_reset_car = Back
pad_reset_ball = LeftStick
pad_unlimited = RightStick
pad_menu = Start
pad_kickoff_0 = DPadUp
pad_kickoff_1 = DPadDown
pad_kickoff_2 = DPadLeft
pad_kickoff_3 = DPadRight
pad_kickoff_4 = 

[physics]
tick = 120

[boost]
unlimited = false
drain = 33.33
recharge = 10

[arena]
soccar = true
mesh_dir = collision_meshes
arena_dir = arena_assets/stadium_day

[game]
kickoff_index = 0

[render]
msaa = 8
max_fps = 0
pacing_log = false
pbr = false
wall_opacity = 0.40
pack_spec = true
